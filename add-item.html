<!-- Add Item Page -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Item – lendNborrow</title>
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header id="navbar"></header>
  <main>
    <h2>Add New Item</h2>
    <div id="error" style="color:red; display:none;"></div>
    <div id="message" style="color:green; display:none;"></div>
    <div id="loading" style="display:none;">Loading...</div>
    <form id="add-item-form" enctype="multipart/form-data">
      <label>Title: <input type="text" name="title" required /></label><br/>
      <label>Description:<br/><textarea name="description" required></textarea></label><br/>
      <label>Category: <input type="text" name="category" required /></label><br/>
      <label>Condition: <input type="text" name="condition" required /></label><br/>
      <label>Image: <input type="file" name="image" accept="image/*" /></label><br/>
      <button type="submit">Add Item</button>
    </form>
  </main>
  <script type="module" src="js/pages/add-item.js"></script>
</body>
</html>
