<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browse Catalog — lendNborrow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/assets/logo.png">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header id="header" class="hdr"></header>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Browse Campus Catalog</h1>
        <p class="page-subtitle">Search calculators, drafting tools, lab equipment, and books by category or college</p>
      </div>
      <div class="page-actions">
        <a href="/listing-form.html" class="btn btn-maroon">List an Item</a>
      </div>
    </div>

    <div class="card section-block">
      <div class="card-body-compact">
        <div class="filter-bar">
          <div class="filter-search">
            <input type="text" id="search-input" placeholder="Search by title, keyword, or equipment name..." aria-label="Search items" />
          </div>
          <div class="filter-select">
            <select id="college-select" aria-label="Filter by college">
              <option value="All">All Colleges</option>
              <option value="CICS">CICS</option>
              <option value="CEAFA">CEAFA</option>
              <option value="CIT">CIT</option>
              <option value="CAFAD">CAFAD</option>
              <option value="CABEIHM">CABEIHM</option>
              <option value="CAS">CAS</option>
              <option value="CTE">CTE</option>
            </select>
          </div>
          <div class="filter-select">
            <select id="status-select" aria-label="Filter by availability">
              <option value="available">Available Only</option>
              <option value="all">All Statuses</option>
            </select>
          </div>
          <div class="filter-select">
            <select id="sort-select" aria-label="Sort items">
              <option value="newest">Newest First</option>
              <option value="oldest">Oldest First</option>
              <option value="title_asc">Title (A-Z)</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="category-pills" id="category-pills">
      <button class="category-pill active" data-category="All">All Categories</button>
      <button class="category-pill" data-category="Academic & Engineering">Academic & Engineering</button>
      <button class="category-pill" data-category="Electronics & Gadgets">Electronics & Gadgets</button>
      <button class="category-pill" data-category="Lab & Workshop">Lab & Workshop</button>
      <button class="category-pill" data-category="Books & Reviewers">Books & Reviewers</button>
      <button class="category-pill" data-category="Other">Other</button>
    </div>

    <div id="loading-state" class="loading-box">
      <div class="spinner"></div>
      <p>Loading campus listings...</p>
    </div>

    <div id="empty-state" class="empty-state hidden">
      <h3 id="empty-heading">No items listed yet</h3>
      <p id="empty-desc">Post the first item for your college, or adjust your active filters.</p>
      <div class="empty-state-actions">
        <a href="/listing-form.html" class="btn btn-maroon btn-sm">List an Item</a>
        <button type="button" id="reset-filters-btn" class="btn btn-outline btn-sm">Reset Filters</button>
      </div>
    </div>

    <div class="catalog-grid" id="items-grid"></div>

    <div id="pagination-controls" class="pagination-bar hidden">
      <button id="prev-page-btn" class="btn btn-outline btn-sm">Previous</button>
      <span id="page-info" class="page-info-text">Page 1 of 1</span>
      <button id="next-page-btn" class="btn btn-outline btn-sm">Next</button>
    </div>
  </main>

  <div id="toast" class="toast hidden" role="status"></div>

  <script type="module">
    import { initLayout } from '/js/layout.js';
    import { getItems, createItemCardElement } from '/js/items.js';

    initLayout();

    const urlParams = new URLSearchParams(window.location.search);
    let currentCategory = urlParams.get('category') || 'All';
    let currentPage = 1;
    let totalPages = 1;

    const itemsGrid = document.getElementById('items-grid');
    const loadingState = document.getElementById('loading-state');
    const emptyState = document.getElementById('empty-state');
    const emptyHeading = document.getElementById('empty-heading');
    const emptyDesc = document.getElementById('empty-desc');
    const resetFiltersBtn = document.getElementById('reset-filters-btn');
    const paginationControls = document.getElementById('pagination-controls');
    const pageInfo = document.getElementById('page-info');
    const prevBtn = document.getElementById('prev-page-btn');
    const nextBtn = document.getElementById('next-page-btn');
    const searchInput = document.getElementById('search-input');
    const collegeSelect = document.getElementById('college-select');
    const sortSelect = document.getElementById('sort-select');
    const statusSelect = document.getElementById('status-select');
    const categoryPills = document.querySelectorAll('.category-pill');

    // Apply initial URL filters if present
    if (urlParams.get('q')) {
      searchInput.value = urlParams.get('q');
    }
    if (urlParams.get('college')) {
      collegeSelect.value = urlParams.get('college');
    }
    categoryPills.forEach(pill => {
      pill.classList.toggle('active', pill.dataset.category === currentCategory);
    });

    async function loadCatalog() {
      loadingState.classList.remove('hidden');
      emptyState.classList.add('hidden');
      itemsGrid.replaceChildren();

      try {
        const result = await getItems({
          q: searchInput.value.trim(),
          category: currentCategory,
          college: collegeSelect.value,
          sort: sortSelect.value,
          status: statusSelect.value,
          page: currentPage,
          limit: 12
        });

        loadingState.classList.add('hidden');

        const items = result.items || [];
        const pagination = result.pagination || {};
        totalPages = pagination.totalPages || 1;

        if (items.length === 0) {
          const hasFilters =
            searchInput.value.trim() !== '' ||
            currentCategory !== 'All' ||
            collegeSelect.value !== 'All' ||
            statusSelect.value !== 'available';

          emptyHeading.textContent = hasFilters
            ? 'No matching items found'
            : 'No items listed yet';
          emptyDesc.textContent = hasFilters
            ? 'No listings match your current search or filter criteria.'
            : 'Post the first item for your college so fellow students can borrow it.';
          emptyState.classList.remove('hidden');
          paginationControls.classList.add('hidden');
          return;
        }

        items.forEach(item => {
          itemsGrid.appendChild(createItemCardElement(item));
        });

        if (totalPages > 1) {
          paginationControls.classList.remove('hidden');
          pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
          prevBtn.disabled = currentPage <= 1;
          nextBtn.disabled = currentPage >= totalPages;
        } else {
          paginationControls.classList.add('hidden');
        }
      } catch (err) {
        loadingState.classList.add('hidden');
        emptyHeading.textContent = 'Unable to load catalog';
        emptyDesc.textContent = err.message || 'Please check your connection and try again.';
        emptyState.classList.remove('hidden');
      }
    }

    categoryPills.forEach(pill => {
      pill.addEventListener('click', () => {
        categoryPills.forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        currentCategory = pill.dataset.category;
        currentPage = 1;
        loadCatalog();
      });
    });

    resetFiltersBtn.addEventListener('click', () => {
      searchInput.value = '';
      collegeSelect.value = 'All';
      statusSelect.value = 'available';
      sortSelect.value = 'newest';
      currentCategory = 'All';
      categoryPills.forEach(p => p.classList.toggle('active', p.dataset.category === 'All'));
      currentPage = 1;
      loadCatalog();
    });

    let searchTimeout;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        currentPage = 1;
        loadCatalog();
      }, 300);
    });

    collegeSelect.addEventListener('change', () => {
      currentPage = 1;
      loadCatalog();
    });

    sortSelect.addEventListener('change', () => {
      currentPage = 1;
      loadCatalog();
    });

    statusSelect.addEventListener('change', () => {
      currentPage = 1;
      loadCatalog();
    });

    prevBtn.addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        loadCatalog();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentPage < totalPages) {
        currentPage++;
        loadCatalog();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

    loadCatalog();
  </script>
</body>
</html>
