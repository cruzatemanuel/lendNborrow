<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — lendNborrow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="/assets/logo.png">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header id="header" class="hdr"></header>

  <main class="main-content">
    <div class="auth-container auth-container-md">
      <div class="auth-header">
        <h1 class="page-title">Create Student Account</h1>
        <p class="page-subtitle">Register with your BatStateU Alangilan student details</p>
      </div>

      <div id="error-alert" class="alert alert-error hidden"></div>

      <form id="signup-form">
        <div class="form-group">
          <label for="email">BatStateU GSuite Email *</label>
          <input type="email" id="email" required placeholder="sr-code@g.batstate-u.edu.ph" autocomplete="email" />
          <div class="form-help">Must end with @g.batstate-u.edu.ph. A verification link will be sent to this address.</div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="password">Password *</label>
            <input type="password" id="password" required minlength="6" placeholder="At least 6 characters" autocomplete="new-password" />
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirm Password *</label>
            <input type="password" id="confirm-password" required minlength="6" placeholder="Re-enter password" autocomplete="new-password" />
          </div>
        </div>

        <div class="form-group">
          <label for="full_name">Full Name *</label>
          <input type="text" id="full_name" required placeholder="Enter your full name" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="student_number">Student Number / SR-Code *</label>
            <input type="text" id="student_number" required placeholder="e.g. 22-00000" />
          </div>
          <div class="form-group">
            <label for="college">College *</label>
            <select id="college" required>
              <option value="">Select College</option>
              <option value="CICS">CICS (College of Informatics and Computing Sciences)</option>
              <option value="COE">COE (College of Engineering)</option>
              <option value="CET">CET (College of Engineering Technology)</option>
              <option value="CAFAD">CAFAD (College of Architecture, Fine Arts, and Design)</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="campus">Campus</label>
            <input type="text" id="campus" value="Alangilan" required readonly class="input-readonly" />
          </div>
          <div class="form-group">
            <label for="contact">Contact Number</label>
            <input type="text" id="contact" placeholder="09XXXXXXXXX" />
          </div>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-maroon btn-block">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/signin.html">Sign in</a>
      </div>
    </div>
  </main>

  <div id="toast" class="toast hidden" role="status"></div>

  <script type="module">
    import { initLayout } from '/js/layout.js';
    import { register } from '/js/auth.js';

    initLayout();

    const form = document.getElementById('signup-form');
    const errorAlert = document.getElementById('error-alert');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.classList.add('hidden');

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const full_name = document.getElementById('full_name').value.trim();
      const student_number = document.getElementById('student_number').value.trim();
      const college = document.getElementById('college').value;
      const campus = document.getElementById('campus').value.trim();
      const contact = document.getElementById('contact').value.trim();

      if (!email.toLowerCase().endsWith('@g.batstate-u.edu.ph')) {
        errorAlert.textContent = 'Registration requires an official BatStateU GSuite email (@g.batstate-u.edu.ph).';
        errorAlert.classList.remove('hidden');
        return;
      }

      if (password !== confirmPassword) {
        errorAlert.textContent = 'Passwords do not match.';
        errorAlert.classList.remove('hidden');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      try {
        await register({
          email,
          password,
          full_name,
          student_number,
          college,
          campus,
          contact
        });

        window.location.href = `/check-email.html?email=${encodeURIComponent(email)}`;
      } catch (err) {
        errorAlert.textContent = err.message || 'Registration failed. Please try again.';
        errorAlert.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
