<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Profile — lendNborrow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header id="header" class="hdr"></header>

  <main class="main-content">
    <div class="auth-container auth-container-md">
      <div class="auth-header-split">
        <div>
          <h1 class="page-title">Student Profile</h1>
          <p class="page-subtitle">Update your university contact and college information</p>
        </div>
        <span id="verification-badge" class="badge badge-green">Verified</span>
      </div>

      <div id="first-time-notice" class="alert alert-notice hidden">
        Please enter your student number and college to complete your profile before listing or borrowing items.
      </div>

      <div id="error-alert" class="alert alert-error hidden"></div>

      <form id="profile-form">
        <div class="form-group">
          <label for="email">Institutional GSuite Email</label>
          <input type="email" id="email" readonly class="input-readonly" />
          <div class="form-help">Linked to your BatStateU account and cannot be changed</div>
        </div>

        <div class="form-group">
          <label for="full_name">Full Name</label>
          <input type="text" id="full_name" readonly class="input-readonly" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="student_number">Student Number / SR-Code</label>
            <input type="text" id="student_number" readonly class="input-readonly" />
          </div>
          <div class="form-group">
            <label for="college">College *</label>
            <select id="college" required>
              <option value="">Select College</option>
              <option value="CICS">CICS (College of Informatics and Computing Sciences)</option>
              <option value="COE">COE (College of Engineering)</option>
              <option value="CET">CET (College of Engineering Technology)</option>
              <option value="CAFAD">CAFAD (College of Architecture, Fine Arts, and Design)</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="campus">Campus</label>
            <input type="text" id="campus" value="Alangilan" readonly class="input-readonly" />
          </div>
          <div class="form-group">
            <label for="contact">Contact Number</label>
            <input type="text" id="contact" placeholder="09XXXXXXXXX" />
          </div>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-maroon btn-block">
          Save Profile
        </button>
      </form>
    </div>
  </main>

  <div id="toast" class="toast hidden" role="status"></div>

  <script type="module">
    import { initLayout, showToast } from '/js/layout.js';
    import { getMe, updateProfile } from '/js/auth.js';

    await initLayout();

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('first_time') === '1') {
      document.getElementById('first-time-notice').classList.remove('hidden');
    }

    const form = document.getElementById('profile-form');
    const errorAlert = document.getElementById('error-alert');
    const submitBtn = document.getElementById('submit-btn');
    const badge = document.getElementById('verification-badge');

    let currentUser;
    try {
      currentUser = await getMe();
    } catch (e) {
      throw e;
    }

    document.getElementById('email').value = currentUser.email || '';
    document.getElementById('full_name').value = currentUser.full_name || '';
    document.getElementById('student_number').value = currentUser.student_number || '';
    document.getElementById('college').value = currentUser.college || '';
    document.getElementById('campus').value = currentUser.campus || 'Alangilan';
    document.getElementById('contact').value = currentUser.contact || '';

    badge.textContent = currentUser.verification_status === 'active' ? 'Verified' : 'Pending Confirmation';
    badge.className = `badge ${currentUser.verification_status === 'active' ? 'badge-green' : 'badge-gold'}`;

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Saving...';

      const college = document.getElementById('college').value;
      const campus = document.getElementById('campus').value.trim();
      const contact = document.getElementById('contact').value.trim();

      try {
        await updateProfile({
          college,
          campus,
          contact
        });

        showToast('Profile saved.', 'success');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Save Profile';

        if (urlParams.get('first_time') === '1') {
          setTimeout(() => window.location.href = '/dashboard.html', 600);
        }
      } catch (err) {
        errorAlert.textContent = err.message || 'Failed to update profile.';
        errorAlert.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Save Profile';
      }
    });
  </script>
</body>
</html>
