<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Profile — lendNborrow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="/assets/logo.png">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header id="header" class="hdr"></header>

  <main class="main-content">
    <div class="auth-container" style="max-width: 580px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 24px;">
        <div>
          <h1 class="page-title" style="font-size: 26px;">Student Profile</h1>
          <p class="page-subtitle">Manage your verified university details</p>
        </div>
        <span id="verification-badge" class="badge badge-green">Active</span>
      </div>

      <!-- First time notice -->
      <div id="first-time-notice" class="hidden" style="background: var(--gold-light); color: var(--gold-text); border: 1px solid var(--gold); padding: 12px; border-radius: var(--radius); margin-bottom: 20px; font-size: 14px; font-weight: 600;">
        👋 Welcome to lendNborrow! Please fill in your student number and college to finish setting up your account.
      </div>

      <!-- Error Alert -->
      <div id="error-alert" class="hidden" style="background: var(--red-soft); color: var(--red); border: 1px solid var(--red); padding: 12px; border-radius: var(--radius); margin-bottom: 20px; font-size: 14px;"></div>

      <form id="profile-form">
        <div class="form-group">
          <label for="email">Institutional GSuite Email</label>
          <input type="email" id="email" readonly style="background: #F5F5F5;" />
          <div class="form-help">Linked to your BatStateU authentication. Cannot be modified.</div>
        </div>

        <div class="form-group">
          <label for="full_name">Full Name *</label>
          <input type="text" id="full_name" required placeholder="Juan Dela Cruz" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="student_number">Student Number / SR-Code *</label>
            <input type="text" id="student_number" required placeholder="21-01234" />
          </div>
          <div class="form-group">
            <label for="college">College / Faculty *</label>
            <select id="college" required>
              <option value="">Select College</option>
              <option value="CICS">CICS (Informatics & Computing)</option>
              <option value="CEAFA">CEAFA (Engineering & Architecture)</option>
              <option value="CIT">CIT (Industrial Technology)</option>
              <option value="CABEIHM">CABEIHM (Accountancy & Business)</option>
              <option value="CAS">CAS (Arts & Sciences)</option>
              <option value="CTE">CTE (Teacher Education)</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="campus">Campus</label>
            <input type="text" id="campus" value="Alangilan" placeholder="Alangilan" />
          </div>
          <div class="form-group">
            <label for="contact">Contact Number</label>
            <input type="text" id="contact" placeholder="09123456789" />
          </div>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-gold btn-block" style="margin-top: 10px;">
          Save Profile Changes
        </button>
      </form>
    </div>
  </main>

  <div id="toast" class="toast hidden" role="status"></div>

  <script type="module">
    import { initLayout, showToast } from '/js/layout.js';
    import { getMe, updateProfile } from '/js/auth.js';

    await initLayout();

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('first_time') === '1') {
      document.getElementById('first-time-notice').classList.remove('hidden');
    }

    const form = document.getElementById('profile-form');
    const errorAlert = document.getElementById('error-alert');
    const submitBtn = document.getElementById('submit-btn');
    const badge = document.getElementById('verification-badge');

    let currentUser;
    try {
      currentUser = await getMe();
    } catch (e) {
      throw e;
    }

    // Populate fields
    document.getElementById('email').value = currentUser.email || '';
    document.getElementById('full_name').value = currentUser.full_name || '';
    document.getElementById('student_number').value = currentUser.student_number || '';
    document.getElementById('college').value = currentUser.college || '';
    document.getElementById('campus').value = currentUser.campus || 'Alangilan';
    document.getElementById('contact').value = currentUser.contact || '';

    badge.textContent = currentUser.verification_status === 'active' ? 'Active Verified' : 'Pending Verification';
    badge.className = `badge ${currentUser.verification_status === 'active' ? 'badge-green' : 'badge-gold'}`;

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Saving...';

      const full_name = document.getElementById('full_name').value.trim();
      const student_number = document.getElementById('student_number').value.trim();
      const college = document.getElementById('college').value;
      const campus = document.getElementById('campus').value.trim();
      const contact = document.getElementById('contact').value.trim();

      try {
        await updateProfile({
          full_name,
          student_number,
          college,
          campus,
          contact
        });

        showToast('Profile updated successfully!', 'success');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Save Profile Changes';

        if (urlParams.get('first_time') === '1') {
          setTimeout(() => window.location.href = '/dashboard.html', 800);
        }
      } catch (err) {
        errorAlert.textContent = err.message || 'Failed to update profile.';
        errorAlert.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Save Profile Changes';
      }
    });
  </script>
</body>
</html>
