<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>List an Item — lendNborrow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/assets/logo.png">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header id="header" class="hdr"></header>

  <main class="main-content">
    <div class="auth-container auth-container-lg">
      <div class="auth-header-left">
        <h1 class="page-title" id="form-heading">List an Item</h1>
        <p class="page-subtitle">Provide item details, maximum borrow duration, and campus pickup location</p>
      </div>

      <div id="error-alert" class="alert alert-error hidden"></div>

      <form id="item-form">
        <div class="form-group">
          <label for="title">Item Title *</label>
          <input type="text" id="title" required placeholder="e.g. Casio FX-991EX Scientific Calculator" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="category">Category *</label>
            <select id="category" required>
              <option value="">Select Category</option>
              <option value="Academic & Engineering">Academic & Engineering</option>
              <option value="Electronics & Gadgets">Electronics & Gadgets</option>
              <option value="Lab & Workshop">Lab & Workshop</option>
              <option value="Books & Reviewers">Books & Reviewers</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="condition">Condition</label>
            <select id="condition">
              <option value="Like New">Like New</option>
              <option value="Good" selected>Good</option>
              <option value="Fair">Fair</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="pickup_location">Campus Pickup Location *</label>
            <input type="text" id="pickup_location" required placeholder="e.g. CICS 3rd Floor Lobby or CEAFA Library" />
          </div>
          <div class="form-group">
            <label for="max_borrow_days">Max Borrow Days *</label>
            <input type="number" id="max_borrow_days" min="1" max="60" value="7" required />
          </div>
        </div>

        <div class="form-group">
          <label for="description">Description & Borrowing Notes</label>
          <textarea id="description" rows="4" placeholder="Include accessories, care instructions, or available handover hours..."></textarea>
        </div>

        <div class="liability-section" id="liability-section">
          <label class="liability-toggle-label" for="has_liability">
            <span class="liability-toggle-copy">
              <span class="liability-toggle-title">Require Damage / Liability Compensation</span>
              <span class="liability-toggle-sub">Specify a required replacement or repair fee if this item is damaged, lost, or improperly returned</span>
            </span>
            <span class="liability-switch-wrap">
              <input
                type="checkbox"
                id="has_liability"
                name="has_liability"
                class="liability-checkbox"
                role="switch"
                aria-controls="liability-fields-panel"
                aria-expanded="false"
              />
              <span class="liability-switch-slider" aria-hidden="true"></span>
            </span>
          </label>

          <div id="liability-fields-panel" class="liability-fields-panel" aria-hidden="true">
            <div class="liability-fields-inner">
              <div class="form-group">
                <label for="liability_amount">Compensation Amount (₱) *</label>
                <div class="currency-input-wrap">
                  <span class="currency-prefix" aria-hidden="true">₱</span>
                  <input
                    type="number"
                    id="liability_amount"
                    name="liability_amount"
                    min="1"
                    max="99999999.99"
                    step="0.01"
                    inputmode="decimal"
                    placeholder="e.g. 500.00"
                    disabled
                  />
                </div>
                <div class="form-help" id="liability-amount-help">
                  Enter the required damage or replacement compensation in Philippine Pesos (minimum ₱1.00).
                </div>
              </div>

              <div class="form-group liability-terms-group">
                <label for="liability_terms">Liability Terms / Conditions (Optional)</label>
                <textarea
                  id="liability_terms"
                  name="liability_terms"
                  rows="2"
                  maxlength="500"
                  placeholder="Full replacement cost if screen is cracked or charger is missing"
                  disabled
                ></textarea>
                <div class="form-help">
                  Clearly describe what constitutes damage, missing parts, or loss for prospective borrowers.
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="image">Item Photo (Max 5 MB · JPEG, PNG, WebP)</label>
          <input type="file" id="image" accept="image/jpeg,image/png,image/webp" />
          <div id="img-preview-box" class="img-preview-container hidden">
            <img id="img-preview" src="" alt="Selected item preview" />
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" id="submit-btn" class="btn btn-maroon btn-primary-flex">
            Publish Listing
          </button>
          <a href="/my-listings.html" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </main>

  <div id="toast" class="toast hidden" role="status"></div>

  <script type="module">
    import { initLayout, showToast } from '/js/layout.js';
    import { getMe } from '/js/auth.js';
    import { getItem, createItem, updateItem, formatPesoAmount } from '/js/items.js';

    await initLayout();

    let currentUser;
    try {
      currentUser = await getMe();
    } catch (err) {
      throw err;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const editId = urlParams.get('id');

    const form = document.getElementById('item-form');
    const formHeading = document.getElementById('form-heading');
    const submitBtn = document.getElementById('submit-btn');
    const errorAlert = document.getElementById('error-alert');
    const imageInput = document.getElementById('image');
    const imgPreviewBox = document.getElementById('img-preview-box');
    const imgPreview = document.getElementById('img-preview');

    const liabilitySection = document.getElementById('liability-section');
    const hasLiabilityInput = document.getElementById('has_liability');
    const liabilityPanel = document.getElementById('liability-fields-panel');
    const liabilityAmountInput = document.getElementById('liability_amount');
    const liabilityTermsInput = document.getElementById('liability_terms');
    const liabilityAmountHelp = document.getElementById('liability-amount-help');

    function updatePesoPreview() {
      const formatted = formatPesoAmount(liabilityAmountInput.value);
      if (formatted) {
        liabilityAmountHelp.textContent = `Required compensation fee: ${formatted} (Philippine Pesos).`;
      } else {
        liabilityAmountHelp.textContent =
          'Enter the required damage or replacement compensation in Philippine Pesos (minimum ₱1.00).';
      }
    }

    function syncLiabilityState(shouldFocus = false) {
      const enabled = hasLiabilityInput.checked;
      hasLiabilityInput.setAttribute('aria-expanded', String(enabled));
      liabilityPanel.setAttribute('aria-hidden', String(!enabled));
      liabilityPanel.classList.toggle('is-open', enabled);
      liabilitySection.classList.toggle('is-active', enabled);

      liabilityAmountInput.disabled = !enabled;
      liabilityAmountInput.required = enabled;
      liabilityTermsInput.disabled = !enabled;

      if (enabled) {
        updatePesoPreview();
        if (shouldFocus) {
          setTimeout(() => liabilityAmountInput.focus(), 80);
        }
      }
    }

    hasLiabilityInput.addEventListener('change', () => syncLiabilityState(true));
    liabilityAmountInput.addEventListener('input', updatePesoPreview);

    imageInput.addEventListener('change', () => {
      const file = imageInput.files[0];
      if (file) {
        if (file.size > 5 * 1024 * 1024) {
          showToast('Image size exceeds the 5 MB limit.', 'error');
          imageInput.value = '';
          imgPreviewBox.classList.add('hidden');
          return;
        }
        const reader = new FileReader();
        reader.onload = (e) => {
          imgPreview.src = e.target.result;
          imgPreviewBox.classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      } else {
        imgPreviewBox.classList.add('hidden');
      }
    });

    if (editId) {
      formHeading.textContent = 'Edit Listing';
      submitBtn.textContent = 'Save Changes';
      document.title = 'Edit Listing — lendNborrow';

      getItem(editId).then(result => {
        const item = result.item;
        if (item.owner_id !== currentUser.id) {
          showToast('You do not have permission to edit this listing.', 'error');
          setTimeout(() => window.location.href = '/my-listings.html', 800);
          return;
        }

        document.getElementById('title').value = item.title;
        document.getElementById('category').value = item.category;
        document.getElementById('condition').value = item.condition;
        document.getElementById('pickup_location').value = item.pickup_location;
        document.getElementById('max_borrow_days').value = item.max_borrow_days;
        document.getElementById('description').value = item.description || '';

        const itemHasLiability = Boolean(item.has_liability && Number(item.liability_amount) > 0);
        hasLiabilityInput.checked = itemHasLiability;
        liabilityAmountInput.value = itemHasLiability ? Number(item.liability_amount).toFixed(2) : '';
        liabilityTermsInput.value = itemHasLiability && item.liability_terms ? item.liability_terms : '';
        syncLiabilityState(false);

        if (item.image_url) {
          imgPreview.src = item.image_url;
          imgPreviewBox.classList.remove('hidden');
        }
      }).catch(() => {
        showToast('Failed to load item details.', 'error');
      });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.classList.add('hidden');

      const hasLiability = hasLiabilityInput.checked;
      let normalizedAmount = null;
      let normalizedTerms = '';

      if (hasLiability) {
        const rawAmount = liabilityAmountInput.value.trim();
        const parsedAmount = Number(rawAmount);

        if (!rawAmount || !Number.isFinite(parsedAmount) || parsedAmount < 1) {
          errorAlert.textContent = 'Please enter a valid compensation amount of at least ₱1.00.';
          errorAlert.classList.remove('hidden');
          liabilityAmountInput.focus();
          return;
        }

        normalizedAmount = (Math.round(parsedAmount * 100) / 100).toFixed(2);
        normalizedTerms = liabilityTermsInput.value.trim();
      }

      submitBtn.disabled = true;
      submitBtn.textContent = editId ? 'Saving...' : 'Publishing...';

      const formData = new FormData();
      formData.append('title', document.getElementById('title').value.trim());
      formData.append('category', document.getElementById('category').value);
      formData.append('condition', document.getElementById('condition').value);
      formData.append('pickup_location', document.getElementById('pickup_location').value.trim());
      formData.append('max_borrow_days', document.getElementById('max_borrow_days').value);
      formData.append('description', document.getElementById('description').value.trim());
      formData.append('has_liability', hasLiability ? 'true' : 'false');
      formData.append('liability_amount', hasLiability ? normalizedAmount : '');
      formData.append('liability_terms', hasLiability ? normalizedTerms : '');

      if (imageInput.files[0]) {
        formData.append('image', imageInput.files[0]);
      }

      try {
        if (editId) {
          await updateItem(editId, formData);
          showToast('Listing updated.', 'success');
          setTimeout(() => window.location.href = `/item.html?id=${editId}`, 600);
        } else {
          await createItem(formData);
          showToast('Item listed.', 'success');
          setTimeout(() => window.location.href = '/my-listings.html', 600);
        }
      } catch (err) {
        errorAlert.textContent = err.message || 'Failed to save listing.';
        errorAlert.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = editId ? 'Save Changes' : 'Publish Listing';
      }
    });
  </script>
</body>
</html>
