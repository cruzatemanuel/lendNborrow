<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — lendNborrow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/assets/logo.png">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header id="header" class="hdr"></header>

  <main class="main-content">
    <div class="auth-container">
      <div class="auth-header">
        <h1 class="page-title">Student Sign In</h1>
        <p class="page-subtitle">Sign in with your BatStateU GSuite account</p>
      </div>

      <div id="confirmed-banner" class="alert alert-success hidden">
        Your BatStateU email has been confirmed. You can now sign in.
      </div>

      <div id="error-alert" class="alert alert-error hidden"></div>

      <form id="signin-form">
        <div class="form-group">
          <label for="email">BatStateU GSuite Email</label>
          <input type="email" id="email" required placeholder="sr-code@g.batstate-u.edu.ph" autocomplete="email" />
          <div class="form-help">Use your official @g.batstate-u.edu.ph address</div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="Enter your password" autocomplete="current-password" />
        </div>

        <button type="submit" id="submit-btn" class="btn btn-maroon btn-block">
          Sign In
        </button>
      </form>

      <div id="google-auth-container" class="hidden">
        <div class="auth-divider">
          <span>or</span>
        </div>
        <button type="button" id="btn-google" class="btn btn-secondary btn-block">
          <span>Sign in with Google (@g.batstate-u.edu.ph)</span>
        </button>
      </div>

      <div class="auth-footer">
        Need an account? <a href="/signup.html">Create a student account</a>
      </div>
    </div>
  </main>

  <div id="toast" class="toast hidden" role="status"></div>

  <script type="module">
    import { initLayout, showToast } from '/js/layout.js';
    import { login, getAuthConfig, getGoogleAuthUrl } from '/js/auth.js';

    initLayout();

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('confirmed') === '1') {
      document.getElementById('confirmed-banner').classList.remove('hidden');
    }

    const errorAlert = document.getElementById('error-alert');
    const form = document.getElementById('signin-form');
    const submitBtn = document.getElementById('submit-btn');

    getAuthConfig().then(config => {
      if (config?.googleAuthEnabled) {
        const googleBox = document.getElementById('google-auth-container');
        googleBox.classList.remove('hidden');
        document.getElementById('btn-google').addEventListener('click', async () => {
          try {
            const url = await getGoogleAuthUrl();
            if (url) window.location.href = url;
          } catch (err) {
            showToast(err.message, 'error');
          }
        });
      }
    }).catch(() => {});

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        await login({ email, password });
        showToast('Signed in.', 'success');
        const redirectUrl = urlParams.get('redirect') || '/dashboard.html';
        window.location.href = redirectUrl;
      } catch (err) {
        errorAlert.textContent = err.message || 'Sign in failed. Check your email and password.';
        errorAlert.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
