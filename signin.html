<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — lendNborrow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="/assets/logo.png">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header id="header" class="hdr"></header>

  <main class="main-content">
    <div class="auth-container">
      <div style="text-align: center; margin-bottom: 24px;">
        <h1 class="page-title" style="font-size: 26px;">Student Sign In</h1>
        <p class="page-subtitle">Access your lendNborrow campus account</p>
      </div>

      <!-- Verified Email Success Banner -->
      <div id="confirmed-banner" class="hidden" style="background: var(--green-soft); color: var(--green); border: 1px solid var(--green); padding: 12px; border-radius: var(--radius); margin-bottom: 20px; font-size: 14px; font-weight: 600;">
        ✓ Your BatStateU GSuite email has been verified! You can now sign in.
      </div>

      <!-- Error Alert -->
      <div id="error-alert" class="hidden" style="background: var(--red-soft); color: var(--red); border: 1px solid var(--red); padding: 12px; border-radius: var(--radius); margin-bottom: 20px; font-size: 14px;"></div>

      <form id="signin-form">
        <div class="form-group">
          <label for="email">BatStateU GSuite Email</label>
          <input type="email" id="email" required placeholder="sr-code@g.batstate-u.edu.ph" autocomplete="email" />
          <div class="form-help">Must end with @g.batstate-u.edu.ph</div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password" />
        </div>

        <button type="submit" id="submit-btn" class="btn btn-maroon btn-block" style="margin-top: 8px;">
          Sign In
        </button>
      </form>

      <!-- Optional Google Sign-In Container -->
      <div id="google-auth-container" class="hidden" style="margin-top: 24px; text-align: center;">
        <div style="display: flex; align-items: center; margin: 18px 0;">
          <div style="flex: 1; height: 1px; background: var(--border-light);"></div>
          <span style="padding: 0 12px; font-size: 12px; color: var(--muted); text-transform: uppercase;">or</span>
          <div style="flex: 1; height: 1px; background: var(--border-light);"></div>
        </div>
        <button type="button" id="btn-google" class="btn btn-secondary btn-block">
          <span>Sign in with Google (@g.batstate-u.edu.ph)</span>
        </button>
      </div>

      <div style="text-align: center; margin-top: 24px; font-size: 14px; color: var(--muted);">
        Don't have an account? <a href="/signup.html" style="color: var(--maroon); font-weight: 700;">Sign up here</a>
      </div>
    </div>
  </main>

  <div id="toast" class="toast hidden" role="status"></div>

  <script type="module">
    import { initLayout, showToast } from '/js/layout.js';
    import { login, getAuthConfig, getGoogleAuthUrl } from '/js/auth.js';

    initLayout();

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('confirmed') === '1') {
      document.getElementById('confirmed-banner').classList.remove('hidden');
    }

    const errorAlert = document.getElementById('error-alert');
    const form = document.getElementById('signin-form');
    const submitBtn = document.getElementById('submit-btn');

    // Show Google login only if enabled on backend
    getAuthConfig().then(config => {
      if (config?.googleAuthEnabled) {
        const googleBox = document.getElementById('google-auth-container');
        googleBox.classList.remove('hidden');
        document.getElementById('btn-google').addEventListener('click', async () => {
          try {
            const url = await getGoogleAuthUrl();
            if (url) window.location.href = url;
          } catch (err) {
            showToast(err.message, 'error');
          }
        });
      }
    }).catch(() => {});

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        await login({ email, password });
        showToast('Signed in successfully!', 'success');
        const redirectUrl = urlParams.get('redirect') || '/dashboard.html';
        window.location.href = redirectUrl;
      } catch (err) {
        errorAlert.textContent = err.message || 'Failed to sign in. Please check your credentials.';
        errorAlert.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
