<!-- Register Page -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register – lendNborrow</title>
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header id="navbar"></header>
  <main>
    <h2>Register</h2>
    <div id="error" style="color:red; display:none;"></div>
    <div id="message" style="color:green; display:none;"></div>
    <div id="loading" style="display:none;">Loading...</div>
    <form id="register-form">
      <label>Full Name: <input type="text" name="full_name" required /></label><br/>
      <label>Department: <input type="text" name="department" required /></label><br/>
      <label>Email: <input type="email" name="email" required /></label><br/>
      <label>Password: <input type="password" name="password" required /></label><br/>
      <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="login.html">Log In</a></p>
  </main>
  <script type="module" src="js/pages/register.js"></script>
</body>
</html>
